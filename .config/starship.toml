## Colores Vesper (a juego con kitty y las islas de Waybar)
##   melocoton #ffc799 · blanco #e0e0e0 · gris #a0a0a0 · gris oscuro #505050
##   menta #99ffe4 · rojo suave #ff8080

## FIRST LINE/ROW: Info & Status
# First param ─┌   Estructura: ╭─usuario in  directorio
[username]
format = " [╭─](#505050)[$user]($style) [in](#a0a0a0) "
show_always = true
style_root = "bold #ff8080"
style_user = "bold #ffc799"

# Second param: sin "@equipo"
[hostname]
disabled = true

# Third param: icono de carpeta + ruta (dentro de un repo, desde su raiz)
[directory]
format = "[󰉋 $path]($style)[$read_only]($read_only_style) "
style = "bold #e0e0e0"
read_only = " 󰌾"
read_only_style = "#ff8080"
home_symbol = "~"
truncate_to_repo = true
truncation_length = 0
truncation_symbol = ""

# Fourth param
[sudo]
disabled = false

# Before all the version info (python, nodejs, php, etc.)
[git_status]
ahead = "⇡${count}"
behind = "⇣${count}"
deleted = "x"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
style = "#a0a0a0"

# Last param in the first line/row
[cmd_duration]
disabled = true
format = "[took](#505050) [$duration]($style)"
style = "#a0a0a0"
min_time = 1

## SECOND LINE/ROW: Prompt
# Somethere at the beginning
[battery]
charging_symbol = ""
disabled = true
discharging_symbol = ""
full_symbol = ""

[[battery.display]] # "bold red" style when capacity is between 0% and 15%
disabled = false
style = "bold red"
threshold = 15

[[battery.display]] # "bold yellow" style when capacity is between 15% and 50%
disabled = true
style = "bold yellow"
threshold = 50

[[battery.display]] # "bold green" style when capacity is between 50% and 80%
disabled = true
style = "bold green"
threshold = 80

# Prompt: optional param 1
[time]
disabled = true
format = " 🕙 $time($style)\n"
style = "bright-white"
time_format = "%T"

# Prompt: param 2
[character]
# Conector ╰─ en el mismo gris que ╭─; solo el simbolo lleva color
error_symbol = " [╰─](#505050)[×](bold #ff8080)"
success_symbol = " [╰─](#505050)[λ](bold #ffc799)"

# SYMBOLS
[status]
disabled = false
style = "#ff8080"
format = '[\[$status\]]($style)'
map_symbol = false
pipestatus = true
symbol = ""

[aws]
symbol = " "

[conda]
symbol = " "

[dart]
symbol = " "

[docker_context]
symbol = " "

[elixir]
symbol = " "

[elm]
symbol = " "

[git_branch]
symbol = " "
style = "#99ffe4"
format = "[on](#a0a0a0) [$symbol$branch]($style) "

[golang]
symbol = " "

[hg_branch]
symbol = " "

[java]
symbol = " "

[julia]
symbol = " "

[nim]
symbol = " "

[nix_shell]
symbol = " "

[nodejs]
symbol = " "

[package]
symbol = " "

[perl]
symbol = " "

[php]
symbol = " "

[python]
symbol = " "

[ruby]
symbol = " "

[rust]
symbol = " "

[swift]
symbol = "ﯣ "
