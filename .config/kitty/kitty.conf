shell fish

# Fuente: la misma de Waybar, wofi y mako
font_family JetBrains Mono
font_size 11.0

# Cursor settings
cursor_shape beam
cursor_blink_interval 0
cursor_stop_blinking_after 0
cursor_trail 25
# Segundos que tarda la estela en desaparecer (salto corto, salto largo);
# un poco mas lenta que el default (0.1 0.4) para ir a juego con las ventanas
cursor_trail_decay 0.15 0.5
cursor_trail_color #e0e0e0

enable_wayland yes

# Evita que kitty recuerde y reaplique el estado "maximizado" de una
# instancia anterior al abrir una nueva ventana. Esto era lo que causaba
# que cada terminal nueva se abriera en "pantalla completa" en vez de
# acomodarse en mosaico con las demás ventanas (Hyprland).
remember_window_size no

# Margen interno: el texto no queda pegado al borde
window_padding_width 10

# Transparencia nativa (el blur lo pone Hyprland)
background_opacity 0.75

# Opcional: un ligero blur interno
#background_blur 10

# === Vesper - minimalista, a juego con las islas de Waybar ===
#   Casi todo blanco/gris, un acento melocoton y verde menta.
#   Anterior: paleta Nord invertida (pensada para fondo claro), en git
foreground            #e0e0e0
background            #101010
selection_foreground  #ffffff
selection_background  #343434
cursor                #e0e0e0
cursor_text_color     #101010
url_color             #ffc799

# negro
color0  #1c1c1c
color8  #505050
# rojo (suave, como el boton de apagado)
color1  #ff8080
color9  #ff9f9f
# verde (menta)
color2  #99ffe4
color10 #b3ffea
# amarillo (acento melocoton)
color3  #ffc799
color11 #ffd4ad
# azul (grisaceo, para no romper el tono neutro)
color4  #9fb4d1
color12 #b8c9e0
# magenta
color5  #d8b4e2
color13 #e5cbec
# cian
color6  #99ffe4
color14 #b3ffea
# blanco
color7  #a0a0a0
color15 #ffffff
