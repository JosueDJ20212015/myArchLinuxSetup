# =============================================================================
# Hyprlock - islas transparentes, a juego con Waybar
# Estilo anterior: en git (antes del commit "hyprlock: estilo islas")
# =============================================================================

# background: el escritorio actual con blur
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.15
    vibrancy_darkness = 0.2
}

# general
general {
    hide_cursor = false
    grace = 0
    disable_loading_bar = false
}

# animations: aparece y desaparece con fundido (misma curva que las ventanas)
animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 4, easeOutQuint
    animation = fadeOut, 1, 2.5, easeOutQuint
    animation = inputFieldDots, 1, 2, easeOutQuint
}

# time: 12 horas como en Waybar
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M")"
    color = rgba(224, 224, 224, 0.95)
    font_size = 110
    font_family = JetBrains Mono ExtraBold
    position = 0, 230
    halign = center
    valign = center
}

# AM/PM
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%p")"
    color = rgba(160, 160, 160, 0.9)
    font_size = 18
    font_family = JetBrains Mono
    position = 0, 130
    halign = center
    valign = center
}

# date en español
label {
    monitor =
    text = cmd[update:60000] echo "$(LC_TIME=es_HN.UTF-8 date +"%A, %d de %B")"
    color = rgba(160, 160, 160, 0.9)
    font_size = 16
    font_family = JetBrains Mono
    position = 0, 95
    halign = center
    valign = center
}

# isla del usuario
shape {
    monitor =
    size = 220, 46
    color = rgba(40, 40, 40, 0.35)
    rounding = 10
    border_size = 1
    border_color = rgba(255, 255, 255, 0.08)
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text =   $USER
    color = rgba(224, 224, 224, 0.95)
    font_size = 14
    font_family = JetBrains Mono
    position = 0, -60
    halign = center
    valign = center
}

# input field: isla translucida con contorno fino
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 1
    rounding = 10
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.12)
    inner_color = rgba(40, 40, 40, 0.45)
    font_color = rgba(224, 224, 224, 1)
    font_family = JetBrains Mono
    check_color = rgba(224, 224, 224, 0.6)
    fail_color = rgba(229, 115, 115, 1)
    fail_text = <span foreground="##e57373">Contraseña incorrecta ($ATTEMPTS)</span>
    capslock_color = rgba(255, 199, 153, 1)
    placeholder_text = <span foreground="##a0a0a0">Contraseña…</span>
    fade_on_empty = false
    hide_input = false
    position = 0, -130
    halign = center
    valign = center
}

# distribucion de teclado activa (cambias con Win+Espacio)
label {
    monitor =
    text = 󰌌  $LAYOUT
    color = rgba(160, 160, 160, 0.8)
    font_size = 11
    font_family = JetBrains Mono
    position = 0, 40
    halign = center
    valign = bottom
}
